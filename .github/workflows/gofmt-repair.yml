name: One-time Go formatting repair

on:
  push:
    branches:
      - feat/api-go-backend
    paths:
      - .github/workflows/gofmt-repair.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/api-go-backend
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23'
      - name: Format all Go files in api_go
        working-directory: api_go
        run: gofmt -w $(find . -name '*.go' -type f)
      - name: Commit formatting changes
        run: |
          if git diff --quiet -- api_go; then
            echo "All Go files already formatted."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add api_go
          git commit -m "Run gofmt across Go API"
          git push origin HEAD:feat/api-go-backend
