name: Generate pnpm lockfile

on:
  push:
    branches: [feat/api-go-backend]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'pnpm-workspace.yaml'
      - '.github/workflows/generate-pnpm-lock.yml'

permissions:
  contents: write

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.18.3
      - name: Generate pnpm lockfile from npm lockfile
        run: pnpm import
      - name: Commit generated lockfile
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "pnpm-lock.yaml is already up to date"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore: add generated pnpm lockfile"
          git push
