name: Build Flutter APKs

on:
  workflow_call:
  push:
    branches: [main, master]
    paths:
      - 'apps/rider_app/**'
      - 'apps/driver_app/**'
      - '.github/workflows/build-flutter-apk.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'apps/rider_app/**'
      - 'apps/driver_app/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-rider:
    name: Build Rider App APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@1508160852fb97248640997f7cfb38da241df0ba # v2.9.1
        with:
          flutter-version: '3.47.8'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        working-directory: apps/rider_app
        run: flutter pub get

      - name: Analyze
        working-directory: apps/rider_app
        run: flutter analyze

      - name: Inject Google Maps API key
        working-directory: apps/rider_app
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          if [ -n "$GOOGLE_MAPS_API_KEY" ]; then
            sed -i "s|android:value=\"AIzaSyDVNVt5hMWuX5Rjr80IXIa-AJ7m7qIrQCk\"|android:value=\"$GOOGLE_MAPS_API_KEY\"|" android/app/src/main/AndroidManifest.xml
          fi

      - name: Build APK (debug)
        working-directory: apps/rider_app
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: rider-app-debug-apk
          path: apps/rider_app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14

  build-driver:
    name: Build Driver App APK
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@1508160852fb97248640997f7cfb38da241df0ba # v2.9.1
        with:
          flutter-version: '3.47.8'
          channel: 'stable'
          cache: true

      - name: Get dependencies
        working-directory: apps/driver_app
        run: flutter pub get

      - name: Analyze
        working-directory: apps/driver_app
        run: flutter analyze

      - name: Inject Google Maps API key
        working-directory: apps/driver_app
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          if [ -n "$GOOGLE_MAPS_API_KEY" ]; then
            sed -i "s|android:value=\"AIzaSyDVNVt5hMWuX5Rjr80IXIa-AJ7m7qIrQCk\"|android:value=\"$GOOGLE_MAPS_API_KEY\"|" android/app/src/main/AndroidManifest.xml
          fi

      - name: Build APK (debug)
        working-directory: apps/driver_app
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: driver-app-debug-apk
          path: apps/driver_app/build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
