# Secret scanning exclusions for Mishwar Yemen admin_web
# Excluded paths also skip push protection checks.
# Review periodically and inform the security team of changes.

paths-ignore:
  # Environment example files contain dummy values only
  - "apps/admin_web/.env.example"
  # Documentation and fixtures
  - "docs/**"
  - "test/fixtures/**"
  - "**/*.example"
  # Build artifacts (not scanned for secrets)
  - ".next/**"
  - "node_modules/**"
